name: workspace-ci

# 工作区级 CI：三个项目各自独立，逐个启动 pytest 进程。
# 为什么不用一条 pytest 命令跑全部：三个项目都有名为 `tests` 的测试包，
# 且都含同名测试文件，在仓库根统一收集会模块名冲突。
# 用矩阵策略分别运行，既有独立的结果反馈，又能在同一个 CI 里看全局。
#
# v1.12 加固要点（specs/design.md §7.1、§7.5）：
#   1. 依赖显式安装：以前用 `pip install -e . || true` 兜底，装失败也照样"绿"，
#      测试跑的根本不是这套依赖 —— 现在装不上就让 job 红。
#   2. `-o addopts=""`：pyproject 里有 addopts="-q"，CI 再传 -q 会变成 -qq，
#      绿的时候连 "N passed" 都不打印，日志里看不出跑了多少用例。
#   3. 测试报告留档：junit XML 传成 artifact，失败时能直接看到哪条用例挂了。
#   4. 最小权限 + 并发取消：默认只要 contents: read；同一分支连推两次时取消旧的那次。
#   5. 规范治理补齐 guard：既有的 review/team/metrics 之外，把入护栏也纳入，
#      否则"规范外实现"在 CI 里没有拦点。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - sdd-daily-report
          - kb-search
          - brownfield-demo
    name: test / ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          # v1.13.1：默认浅克隆不带 tag，`git tag --list` 取不到"最近发布标签"，
          # 会让依赖标签的用例在 CI 上红、本地绿。这里拉全历史与标签（仓库很小）。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: 安装依赖
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          # 依赖由各项目的 pyproject.toml 声明（dev extra 里含 pytest）。
          # 这里**不加**任何"失败也继续"的兜底：装不上就必须红，
          # 否则测试跑的根本不是这套依赖，绿得毫无意义。
          python -m pip install -e ".[dev]"

      - name: 运行测试
        working-directory: ${{ matrix.project }}
        run: python -m pytest -o addopts="" -q --junitxml=report.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.project }}
          path: ${{ matrix.project }}/report.xml
          if-no-files-found: warn
          retention-days: 7

  spec-governance:
    runs-on: ubuntu-latest
    name: 规范治理检查
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdd-daily-report/pyproject.toml

      - name: 安装依赖
        working-directory: sdd-daily-report
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 多工具规范配置同步检查
        working-directory: sdd-daily-report
        run: python scripts/generate_tool_configs.py --check

      - name: 规范审查（生成—评审模式）
        working-directory: sdd-daily-report
        run: python -m sdd_agents review

      - name: 治理检查（ADR 只追加 / 模板底线 / 同步提交）
        working-directory: sdd-daily-report
        run: python -m sdd_agents team

      - name: 入护栏自检（规范外改动必须被拦住）
        working-directory: sdd-daily-report
        run: python -m sdd_agents guard

      - name: 规范兑现度度量
        working-directory: sdd-daily-report
        run: python -m sdd_agents metrics

      - name: Dockerfile 与流水线静态校验（本地无 Docker 也能跑）
        working-directory: sdd-daily-report
        run: python scripts/verify_dockerfile.py
