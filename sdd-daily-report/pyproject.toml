[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-daily-report"
version = "1.0.0"
description = "智能日报生成器 — 《SDD 实战：规范驱动开发之道》主项目复现"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["collector", "generator", "notifier", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
tmp_path_retention_policy = "none"
